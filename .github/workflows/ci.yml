name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Chỉ cần đọc mã nguồn; không dùng secret nào (test mặc định không gọi API AI thật).
permissions:
  contents: read

# Có commit mới trên cùng nhánh thì hủy lượt chạy cũ, đỡ tốn phút CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # chmod: file từ máy Windows có thể mất quyền thực thi khi vào Git (core.fileMode=false).
      - run: chmod +x mvnw && ./mvnw -B test
      # Test đỏ thì có báo cáo chi tiết để đọc, không phải đoán từ log.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Build thử ảnh Docker (không đẩy đi đâu) để bắt lỗi Dockerfile trước khi Render build.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spacex:ci .
