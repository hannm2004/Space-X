name: Security

# Quét bí mật trong TOÀN BỘ lịch sử Git (repo công khai: lộ một lần là lộ mãi).
# Chạy thêm mỗi tuần để bắt lỗi mới ngay cả khi không có commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Thứ Hai 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks phải thấy mọi commit, không chỉ commit mới nhất
      # Có phát hiện thì job đỏ và chặn gộp. Miễn phí cho tài khoản cá nhân.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
