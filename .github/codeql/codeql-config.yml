name: Space-X CodeQL config

# Không phân tích mã test: không được đóng gói chạy thật, và dữ liệu giả trong test
# (mật khẩu mẫu, token mẫu) hay bị báo nhầm là "hard-code credential".
paths-ignore:
  - "src/backend/src/test/**"
  - "src/frontend/src/**/*.test.ts"
  - "src/frontend/src/**/*.test.tsx"
