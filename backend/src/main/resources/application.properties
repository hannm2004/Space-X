spring.application.name=spacex

# Ở máy: đọc biến từ file .env ở thư mục gốc (không có file thì bỏ qua). Trên Render: đặt trong mục Environment.
spring.config.import=optional:file:../.env[.properties]

# Không đặt giá trị mặc định để không kết nối nhầm database. Thiếu DB_URL thì ứng dụng không khởi động
# và báo "'url' must start with jdbc" (Spring giữ nguyên chuỗi ${DB_URL}, không báo tên biến).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Chỉ Flyway được tạo/sửa schema; Hibernate chỉ kiểm tra Entity khớp bảng (D20).
spring.jpa.hibernate.ddl-auto=validate
# Tránh giữ kết nối DB mở suốt vòng đời request ở tầng view.
spring.jpa.open-in-view=false
