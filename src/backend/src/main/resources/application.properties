spring.application.name=spacex

# Ở máy: đọc biến từ file .env ở thư mục gốc (không có file thì bỏ qua). Trên Render: đặt trong mục Environment.
spring.config.import=optional:file:../../.env[.properties]

# Không đặt giá trị mặc định để không kết nối nhầm database. Thiếu DB_URL thì ứng dụng không khởi động
# và báo "'url' must start with jdbc" (Spring giữ nguyên chuỗi ${DB_URL}, không báo tên biến).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ADMIN đầu tiên (D11, D26): đặt cả hai biến hoặc bỏ cả hai. Mặc định rỗng = không tạo; không có mật khẩu mẫu.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Render dừng TLS ở proxy phía trước rồi chuyển HTTP thường kèm X-Forwarded-Proto: https. Đọc header này để
# request.isSecure() đúng, nhờ đó cookie SESSION và XSRF-TOKEN tự có cờ Secure trên Render mà không có cờ ở máy
# (http://localhost), nơi cookie Secure sẽ không được gửi lại. Không cần cờ riêng cho cookie.
server.forward-headers-strategy=framework

# Session lưu trong MySQL (D24, D25). Bảng do Flyway V2 tạo nên không để Spring tự tạo.
spring.session.jdbc.initialize-schema=never

# Chỉ Flyway được tạo/sửa schema; Hibernate chỉ kiểm tra Entity khớp bảng (D20).
spring.jpa.hibernate.ddl-auto=validate
# Tránh giữ kết nối DB mở suốt vòng đời request ở tầng view.
spring.jpa.open-in-view=false
