<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Màu thanh địa chỉ trên điện thoại khớp màu nền trang (--color-paper trong index.css) theo chế độ của hệ điều hành. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <title>Space-X — Học Tin học lớp 6 đến lớp 12</title>
    <meta name="description" content="Học Tin học từ lớp 6 đến lớp 12 theo Chương trình GDPT 2018: bài học tiếng Việt, tìm bài nhanh, theo dõi tiến độ. Miễn phí." />
    <!-- Thẻ chia sẻ: chưa có og:image vì ảnh phải là PNG/JPEG có địa chỉ tuyệt đối; thêm khi đã chốt địa chỉ chính thức. -->
    <meta property="og:title" content="Space-X — Học Tin học lớp 6 đến lớp 12" />
    <meta property="og:description" content="Học Tin học từ lớp 6 đến lớp 12 theo Chương trình GDPT 2018: bài học tiếng Việt, tìm bài nhanh, theo dõi tiến độ. Miễn phí." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Space-X" />
    <!-- Chạy trước khi React tải để trang không nháy sáng rồi mới chuyển tối.
         Logic giống resolveInitialTheme trong src/theme.ts. -->
    <script>
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
